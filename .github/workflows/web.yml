name: Web

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    env:
      # Build-time API URL. Real per-environment values come from Vercel.
      NEXT_PUBLIC_API_URL: https://api.jobflow.ai
      NEXT_PUBLIC_APP_URL: https://app.jobflow.ai

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Phase 1: fetch the openapi.json artifact produced by jobflow-api CI and run
      # `npm run types:api` before typecheck so contract drift fails this build.
